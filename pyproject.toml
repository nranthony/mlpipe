[project]
name = "mlpipe"
version = "0.0.1"
description = "Local, agent-legible modular MLOps pipeline (Numerai host repo)"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "numpy",
  "pydantic>=2",
  "pyyaml",
  "joblib",
  "typer",
]

[project.optional-dependencies]
data = ["numerapi", "pandera[polars]", "duckdb"]   # cycles 1-3
ml = ["lightgbm", "scikit-learn", "optuna"]        # scikit-learn needed from cycle 4
track = ["mlflow>=3", "plotly"]                    # cycle 7: eval reports + tracker
torch = ["torch"]                                  # cycle 8
dev = ["pytest", "hypothesis", "ruff"]

[project.scripts]
mlpipe = "mlpipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpipe"]
