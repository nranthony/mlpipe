[project]
name = "mlpipe"
version = "0.0.1"
description = "Local, agent-legible modular MLOps pipeline (Numerai host repo)"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "numpy",
  "pydantic>=2",
  "pyyaml",
  "joblib",
  "typer",
]

[project.optional-dependencies]
data = ["numerapi", "pandera[polars]", "duckdb"]   # cycles 1-3
ml = ["lightgbm", "scikit-learn", "optuna"]        # scikit-learn needed from cycle 4
track = ["mlflow>=3", "plotly"]                    # cycle 7: eval reports + tracker
torch = ["torch"]                                  # cycle 8
dev = ["pytest", "hypothesis", "ruff"]

[project.scripts]
mlpipe = "mlpipe.cli:app"

[build-system]
requires = ["hatchling==1.32.0"]  # exact pin: build deps are not in uv.lock (ADR-0003)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpipe"]

[tool.ruff.lint]
ignore = [
  "B008",   # typer.Option in defaults is the idiomatic typer CLI pattern
  "RUF012", # Step declares inputs/outputs as plain class-level lists by design
]

[tool.uv]
# Deliberately absent: `no-build`. This project runs under the sandbox's wheels-only
# default (`no-build = true` in /etc/uv/uv.toml): every dependency in uv.lock ships a
# wheel, and uv exempts the project's own editable build from the gate. A new
# sdist-only dependency will fail to install there; that is the gate working. See
# docs/adr/0003-dependency-resolution-hardening.md before adding `no-build = false`.
#
# The one build that remains is mlpipe itself, via hatchling. Its full requirement
# set is pinned here because uv.lock does not cover build dependencies. Bump
# together with the hatchling pin in [build-system].
build-constraint-dependencies = [
  "hatchling==1.32.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.6.1.19",
]
# Resolution quarantine (ADR-0003): ignore anything published after this instant.
# Set to ~14 days before the day you re-lock; never to "now".
exclude-newer = "2026-09-21T00:00:00Z"

# Explicit default index, so resolution does not follow ambient uv/pip config.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true